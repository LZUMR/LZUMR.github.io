<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>反馈与联系 · LZU Math Resources</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <img src="数学院logo.jpg" alt="数学与统计学院" class="brand-logo">
        <img src="萃英logo.jpg" alt="萃英学院" class="brand-logo">
        <div>
          <p class="eyebrow">Lanzhou University</p>
          <h1>Feedback and Contact</h1>
          <p class="subtitle">反馈问题 · 投稿资料 · 加入我们</p>
        </div>
      </div>

      <div class="header-actions">
        <a class="feedback-link" href="index.html">返回主页</a>
        <a class="github-link" href="https://github.com/LZUMR/LZUMR.github.io" target="_blank" rel="noopener" aria-label="打开 GitHub 仓库" title="GitHub 仓库">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2C6.48 2 2 6.59 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.22-3.37-1.22-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.32 9.32 0 0 1 12 6.98c.85 0 1.7.12 2.5.34 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.75-4.57 5.01.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.19 10.19 0 0 0 22 12.25C22 6.59 17.52 2 12 2Z"></path>
          </svg>
        </a>
      </div>
    </header>

    <main class="shell">
      <section class="page-head">
        <p>
          收到的反馈会发到 Yi He 的邮箱，我会尽快回复。
        </p>
      </section>

      <section class="feedback-grid" id="typeGrid" aria-label="选择反馈类型">
        <label class="type-card" data-value="download-broken">
          <input type="radio" name="feedbackType" value="download-broken" hidden>
          <span class="type-name">文件下载损坏</span>
        </label>
        <label class="type-card" data-value="contribution">
          <input type="radio" name="feedbackType" value="contribution" hidden>
          <span class="type-name">投稿更新题目</span>
        </label>
        <label class="type-card" data-value="join-contribute">
          <input type="radio" name="feedbackType" value="join-contribute" hidden>
          <span class="type-name">申请加入贡献与组织</span>
        </label>
        <label class="type-card" data-value="other">
          <input type="radio" name="feedbackType" value="other" hidden>
          <span class="type-name">其他问题</span>
        </label>
      </section>

      <form class="feedback-form" id="feedbackForm" novalidate hidden>
        <div class="form-field">
          <label class="field-label" for="fName">称呼 </label>
          <input class="field-input" id="fName" name="name" type="text" autocomplete="name">
        </div>

        <div class="form-field">
          <label class="field-label" for="fContact">联系方式 <span class="required">必填</span></label>
          <input class="field-input" id="fContact" name="contact" type="text" autocomplete="email" placeholder="邮箱 / QQ / 微信号，方便我回复你" required>
        </div>

        <div class="form-field" id="fileField" hidden>
          <label class="field-label" for="fFile">涉及的文件路径 / 名称 <span class="optional">建议填写</span></label>
          <input class="field-input" id="fFile" name="targetFile" type="text">
        </div>

        <div class="form-field" id="githubField" hidden>
          <label class="field-label" for="fGithub">GitHub 用户名 <span class="optional">选填</span></label>
          <input class="field-input" id="fGithub" name="github" type="text" placeholder="例如：hy-0003">
          <p class="field-hint">有 GitHub 账号的话填一下，方便我把你拉进组织。</p>
        </div>

        <div class="form-field">
          <label class="field-label" for="fMessage">详细说明 <span class="required">必填</span></label>
          <textarea class="field-textarea" id="fMessage" name="message" rows="6" required></textarea>
        </div>

        <p class="form-tip" id="formTip"></p>

        <button class="submit-button" type="submit" id="submitBtn">发送反馈</button>
      </form>

      <p class="success-note" id="successNote" hidden>
        <strong>发送成功，感谢你的反馈！</strong><br>
      </p>

      <section class="contact-panel">
        <h2>其他联系方式</h2>
        <div class="contact-grid">
          <a class="contact-item">
            <span>
              <span class="contact-name">邮箱</span>
              <span class="contact-value">2981130749@qq.com</span>
            </span>
          </a>
          <div class="contact-item">
            <span>
              <span class="contact-name">微信</span>
              <span class="contact-value">HEYI050410</span>
            </span>
          </div>
        </div>
      </section>
    </main>

    <script>
      window.SITE_ANALYTICS = {
        provider: "umami",
        enabled: true
      };
      window.FEEDBACK_CONFIG = {
        email: "2981130749@qq.com",
        provider: "formsubmit",
        formspreeEndpoint: ""
      };
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="e3a87757-4444-44de-a122-66f4155b2a7f"></script>
    <script src="analytics.js"></script>
    <script src="feedback.js"></script>
  </body>
</html>
