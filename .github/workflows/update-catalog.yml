name: Update Catalog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate catalog
        run: zsh scripts/generate-catalog.sh

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.js

          if ! git diff --cached --quiet; then
            git commit -m "Automatically update catalog"
            git push
          fi
