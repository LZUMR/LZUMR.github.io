<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LZU Math Resources</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <img src="数学院logo.jpg" alt="数学与统计学院" class="brand-logo">
        <img src="萃英logo.jpg" alt="萃英学院" class="brand-logo">
        <div>
          <p class="eyebrow">Lanzhou University</p>
          <h1>LZU Math Resources</h1>
          <p class="subtitle">兰州大学数学资料导航</p>
        </div>
      </div>

      <!-- 将 href 替换为本仓库地址。 -->
      <a class="github-link" href="https://github.com/LZUMR" target="_blank" rel="noopener" aria-label="打开 GitHub 仓库" title="GitHub 仓库">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 2C6.48 2 2 6.59 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.22-3.37-1.22-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.32 9.32 0 0 1 12 6.98c.85 0 1.7.12 2.5.34 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.75-4.57 5.01.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.19 10.19 0 0 0 22 12.25C22 6.59 17.52 2 12 2Z"></path>
        </svg>
      </a>
    </header>

    <main class="shell">
      <section class="toolbar" aria-label="资源检索">
        <label class="search-box" for="searchInput">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="搜索科目、描述或文件名">
          <button id="clearSearch" class="icon-button" type="button" aria-label="清空搜索" title="清空搜索">×</button>
        </label>
        <div class="stats" aria-live="polite">
          <strong id="subjectCount">0</strong> 个科目
          <span></span>
          <strong id="fileCount">0</strong> 份文件
        </div>
      </section>

      <section id="subjects" class="subjects" aria-label="科目资源"></section>

      <p id="emptyState" class="empty-state" hidden>没有找到匹配的资源。</p>
    </main>

    <script src="catalog.js"></script>
    <script src="app.js"></script>
  </body>
</html>
